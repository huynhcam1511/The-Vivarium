<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="grassSeed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E8CE94"/>
      <stop offset="60%" stop-color="#C29D55"/>
      <stop offset="100%" stop-color="#7D5C22"/>
    </radialGradient>
    <radialGradient id="cloverSeed" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C87242"/>
      <stop offset="65%" stop-color="#843915"/>
      <stop offset="100%" stop-color="#4E1A04"/>
    </radialGradient>
    <radialGradient id="poppySeed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#555860"/>
      <stop offset="70%" stop-color="#282A30"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </radialGradient>
  </defs>

  <!-- Piled Realistic Seeds (Đống hạt ngũ cốc tự nhiên trong kho trữ) -->
  <g>
    <!-- Grass Seeds (Elongated) -->
    <ellipse cx="45" cy="55" rx="8" ry="3.5" fill="url(#grassSeed)" transform="rotate(-30 45 55)"/>
    <ellipse cx="58" cy="58" rx="8.5" ry="3.8" fill="url(#grassSeed)" transform="rotate(15 58 58)"/>
    <ellipse cx="38" cy="64" rx="7.5" ry="3.2" fill="url(#grassSeed)" transform="rotate(45 38 64)"/>
    <ellipse cx="64" cy="68" rx="8" ry="3.4" fill="url(#grassSeed)" transform="rotate(-20 64 68)"/>
    <ellipse cx="52" cy="72" rx="8" ry="3.5" fill="url(#grassSeed)" transform="rotate(5 52 72)"/>

    <!-- Clover / Red Seeds (Heart/Kidney shaped) -->
    <ellipse cx="32" cy="58" rx="4.5" ry="3.8" fill="url(#cloverSeed)" transform="rotate(20 32 58)"/>
    <ellipse cx="52" cy="48" rx="4.2" ry="3.5" fill="url(#cloverSeed)" transform="rotate(-40 52 48)"/>
    <ellipse cx="44" cy="66" rx="4.6" ry="4.0" fill="url(#cloverSeed)" transform="rotate(60 44 66)"/>

    <!-- Poppy Seeds (Tiny dark granules) -->
    <circle cx="38" cy="50" r="2.2" fill="url(#poppySeed)"/>
    <circle cx="64" cy="50" r="2.4" fill="url(#poppySeed)"/>
    <circle cx="28" cy="68" r="2.0" fill="url(#poppySeed)"/>
    <circle cx="56" cy="65" r="2.3" fill="url(#poppySeed)"/>
    <circle cx="72" cy="64" r="2.2" fill="url(#poppySeed)"/>
  </g>
</svg>
