<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Thorax Fur Gradient -->
    <radialGradient id="beeThoraxFur" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#DDA03A"/>
      <stop offset="45%" stop-color="#9C6219"/>
      <stop offset="85%" stop-color="#4A2B08"/>
      <stop offset="100%" stop-color="#1E1003"/>
    </radialGradient>
    <!-- Abdomen Gradient -->
    <linearGradient id="beeAbdomenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A638"/>
      <stop offset="18%" stop-color="#241405"/>
      <stop offset="34%" stop-color="#EAA936"/>
      <stop offset="50%" stop-color="#221305"/>
      <stop offset="68%" stop-color="#DF9F2E"/>
      <stop offset="84%" stop-color="#1C0E03"/>
      <stop offset="100%" stop-color="#150A02"/>
    </linearGradient>
    <!-- Wing Vein Shimmer -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="40%" stop-color="rgba(230,245,255,0.5)"/>
      <stop offset="80%" stop-color="rgba(210,235,250,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <filter id="beeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#beeShadow)">
    <!-- 6 Legs with Pollen Baskets (Corbicula trên chân sau) -->
    <!-- Front Legs -->
    <path d="M 64 54 Q 50 44 42 36 Q 36 28 30 32" fill="none" stroke="#2B1605" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 76 54 Q 90 44 98 36 Q 104 28 110 32" fill="none" stroke="#2B1605" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Middle Legs -->
    <path d="M 62 64 Q 46 62 36 68 Q 28 74 22 84" fill="none" stroke="#221003" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 78 64 Q 94 62 104 68 Q 112 74 118 84" fill="none" stroke="#221003" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Hind Legs with Golden Pollen Pellets (Cục phấn hoa vàng óng chân sau) -->
    <path d="M 63 76 Q 48 88 38 104 Q 30 118 22 128" fill="none" stroke="#180A01" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 77 76 Q 92 88 102 104 Q 110 118 118 128" fill="none" stroke="#180A01" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Pollen Basket Clumps -->
    <ellipse cx="38" cy="104" rx="5.5" ry="8" fill="#F8C738" stroke="#DCA218" stroke-width="1.2" transform="rotate(25 38 104)"/>
    <ellipse cx="102" cy="104" rx="5.5" ry="8" fill="#F8C738" stroke="#DCA218" stroke-width="1.2" transform="rotate(-25 102 104)"/>

    <!-- Translucent Wings with Detailed Veins (Cánh mỏng có gân cánh) -->
    <!-- Left Forewing -->
    <g transform="rotate(-30 62 58)">
      <path d="M 62 58 C 42 28 20 18 12 28 C 4 38 18 64 62 58 Z" fill="url(#wingGrad)" stroke="rgba(160,190,210,0.6)" stroke-width="0.8"/>
      <path d="M 62 58 Q 36 34 16 26" fill="none" stroke="rgba(100,140,170,0.6)" stroke-width="1.2"/>
      <path d="M 46 42 Q 32 46 22 52" fill="none" stroke="rgba(100,140,170,0.4)" stroke-width="0.7"/>
      <path d="M 36 34 Q 24 38 16 44" fill="none" stroke="rgba(100,140,170,0.4)" stroke-width="0.7"/>
    </g>
    <!-- Right Forewing -->
    <g transform="rotate(30 78 58)">
      <path d="M 78 58 C 98 28 120 18 128 28 C 136 38 122 64 78 58 Z" fill="url(#wingGrad)" stroke="rgba(160,190,210,0.6)" stroke-width="0.8"/>
      <path d="M 78 58 Q 104 34 124 26" fill="none" stroke="rgba(100,140,170,0.6)" stroke-width="1.2"/>
      <path d="M 94 42 Q 108 46 118 52" fill="none" stroke="rgba(100,140,170,0.4)" stroke-width="0.7"/>
      <path d="M 104 34 Q 116 38 124 44" fill="none" stroke="rgba(100,140,170,0.4)" stroke-width="0.7"/>
    </g>

    <!-- Head & Antennae -->
    <path d="M 66 38 Q 60 26 54 18 Q 50 14 46 12" fill="none" stroke="#2E1606" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 74 38 Q 80 26 86 18 Q 90 14 94 12" fill="none" stroke="#2E1606" stroke-width="1.8" stroke-linecap="round"/>
    
    <ellipse cx="70" cy="42" rx="9.5" ry="8.5" fill="#241204"/>
    <!-- Big Compound Eyes (Mắt kép hình hạt đậu lớn) -->
    <ellipse cx="63" cy="40" rx="3.2" ry="5.5" fill="#0C0501" transform="rotate(-12 63 40)"/>
    <ellipse cx="77" cy="40" rx="3.2" ry="5.5" fill="#0C0501" transform="rotate(12 77 40)"/>
    <circle cx="62.2" cy="38" r="1.1" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="76.2" cy="38" r="1.1" fill="#FFFFFF" opacity="0.5"/>

    <!-- Furry Thorax (Ngực phủ lông nhung tơ vàng rực rỡ) -->
    <ellipse cx="70" cy="58" rx="14.5" ry="13" fill="url(#beeThoraxFur)"/>
    <!-- Fur Texture Stitches -->
    <path d="M 62 52 Q 70 48 78 52 M 60 58 Q 70 54 80 58 M 61 64 Q 70 60 79 64" fill="none" stroke="#FCE288" stroke-width="1" opacity="0.6"/>

    <!-- Striped Abdomen (Bụng vân sọc vàng-đen mật ong tự nhiên) -->
    <ellipse cx="70" cy="88" rx="13.5" ry="20" fill="url(#beeAbdomenGrad)"/>
    
    <!-- Fine Segmental Lines & Soft Glow -->
    <path d="M 59 76 Q 70 80 81 76" fill="none" stroke="#FDEBB0" stroke-width="1.2" opacity="0.7"/>
    <path d="M 57 85 Q 70 90 83 85" fill="none" stroke="#FDEBB0" stroke-width="1.2" opacity="0.7"/>
    <path d="M 59 95 Q 70 100 81 95" fill="none" stroke="#FDEBB0" stroke-width="1.2" opacity="0.6"/>
    <path d="M 64 104 Q 70 108 76 104" fill="none" stroke="#FDEBB0" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
