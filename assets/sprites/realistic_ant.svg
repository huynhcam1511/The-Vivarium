<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Chitin Gradient for Camponotus / Carpenter Ant -->
    <radialGradient id="gasterGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7B3F28"/>
      <stop offset="45%" stop-color="#3A1C12"/>
      <stop offset="100%" stop-color="#150B07"/>
    </radialGradient>
    <radialGradient id="thoraxGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8C4A30"/>
      <stop offset="60%" stop-color="#451E14"/>
      <stop offset="100%" stop-color="#1A0D08"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7A3E26"/>
      <stop offset="70%" stop-color="#3D1B11"/>
      <stop offset="100%" stop-color="#120704"/>
    </radialGradient>
    <filter id="chitinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#chitinGlow)">
    <!-- 6 Articulated Legs (Legs connected to thorax) -->
    <!-- Front Legs -->
    <path d="M 54 52 Q 40 40 32 30 Q 26 22 18 26" fill="none" stroke="#2D140D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 66 52 Q 80 40 88 30 Q 94 22 102 26" fill="none" stroke="#2D140D" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Middle Legs -->
    <path d="M 52 58 Q 36 56 24 58 Q 16 60 10 68" fill="none" stroke="#24100A" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 68 58 Q 84 56 96 58 Q 104 60 110 68" fill="none" stroke="#24100A" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Hind Legs (Longer, stronger) -->
    <path d="M 53 64 Q 38 72 28 86 Q 22 96 14 104" fill="none" stroke="#1D0C07" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 67 64 Q 82 72 92 86 Q 98 96 106 104" fill="none" stroke="#1D0C07" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Antennae (Elbowed - đặc trưng loài kiến) -->
    <path d="M 54 34 Q 46 22 40 14 Q 36 10 32 8" fill="none" stroke="#3D1A10" stroke-width="2" stroke-linecap="round"/>
    <path d="M 66 34 Q 74 22 80 14 Q 84 10 88 8" fill="none" stroke="#3D1A10" stroke-width="2" stroke-linecap="round"/>

    <!-- Mandibles (Hàm trên gọng kìm) -->
    <path d="M 56 26 Q 59 21 60 22 Q 61 21 64 26 Z" fill="#240E07"/>

    <!-- Head (Đầu kiến hình trái tim/bầu dục) -->
    <ellipse cx="60" cy="36" rx="10" ry="11" fill="url(#headGrad)"/>
    <!-- Compound Eyes (Mắt kép đen nhánh lấp lánh) -->
    <ellipse cx="53" cy="34" rx="2.2" ry="3.2" fill="#0A0402" transform="rotate(-15 53 34)"/>
    <ellipse cx="67" cy="34" rx="2.2" ry="3.2" fill="#0A0402" transform="rotate(15 67 34)"/>
    <circle cx="52.4" cy="33" r="0.8" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="66.4" cy="33" r="0.8" fill="#FFFFFF" opacity="0.6"/>

    <!-- Thorax / Mesosoma (Ngực kiến thon dài chia 2 đoạn) -->
    <ellipse cx="60" cy="52" rx="7.5" ry="8" fill="url(#thoraxGrad)"/>
    <ellipse cx="60" cy="62" rx="6.5" ry="5.5" fill="url(#thoraxGrad)"/>

    <!-- Petiole (Cuống eo - nốt đơn đặc trưng của kiến thực tế) -->
    <ellipse cx="60" cy="69" rx="3.5" ry="3" fill="#3D1B11"/>

    <!-- Gaster / Abdomen (Bụng kiến lớn chia ngấn hổ phách bóng bẩy) -->
    <ellipse cx="60" cy="85" rx="13" ry="16" fill="url(#gasterGrad)"/>
    
    <!-- Chitin Segmentation Bands (Các vòng ngấn bụng tự nhiên) -->
    <path d="M 49 78 Q 60 82 71 78" fill="none" stroke="#D1804E" stroke-width="1.2" opacity="0.65"/>
    <path d="M 47 84 Q 60 88 73 84" fill="none" stroke="#C46E3A" stroke-width="1.2" opacity="0.55"/>
    <path d="M 50 91 Q 60 95 70 91" fill="none" stroke="#B85D2A" stroke-width="1.2" opacity="0.45"/>

    <!-- Glossy Specular Reflection (Ánh sáng phản chiếu trên lớp vỏ cứng) -->
    <path d="M 54 75 Q 58 72 64 74 Q 66 79 59 79 Q 55 78 54 75 Z" fill="#FFFFFF" opacity="0.28"/>
  </g>
</svg>
