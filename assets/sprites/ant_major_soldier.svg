<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Heavy Chitin Gradient for Major Ant Head -->
    <radialGradient id="majorHeadGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9E482A"/>
      <stop offset="50%" stop-color="#542012"/>
      <stop offset="90%" stop-color="#240A04"/>
      <stop offset="100%" stop-color="#0E0301"/>
    </radialGradient>
    <radialGradient id="majorBodyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7A361E"/>
      <stop offset="60%" stop-color="#3D150B"/>
      <stop offset="100%" stop-color="#120401"/>
    </radialGradient>
    <filter id="majorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#majorShadow)">
    <!-- 6 Heavy Articulated Legs -->
    <path d="M 62 62 Q 44 48 34 36 Q 26 26 16 32" fill="none" stroke="#2B1006" stroke-width="3" stroke-linecap="round"/>
    <path d="M 78 62 Q 96 48 106 36 Q 114 26 124 32" fill="none" stroke="#2B1006" stroke-width="3" stroke-linecap="round"/>
    
    <path d="M 58 72 Q 40 70 26 74 Q 16 80 8 94" fill="none" stroke="#240C04" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 82 72 Q 100 70 114 74 Q 124 80 132 94" fill="none" stroke="#240C04" stroke-width="3.2" stroke-linecap="round"/>
    
    <path d="M 60 84 Q 42 98 30 118 Q 22 130 12 140" fill="none" stroke="#1C0803" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 80 84 Q 98 98 110 118 Q 118 130 128 140" fill="none" stroke="#1C0803" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Antennae -->
    <path d="M 64 36 Q 52 20 44 10 Q 38 6 32 4" fill="none" stroke="#3D1408" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 76 36 Q 88 20 96 10 Q 102 6 108 4" fill="none" stroke="#3D1408" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Massive Crushing Mandibles (Hàm nghiền hạt khổng lồ của Major) -->
    <path d="M 60 26 C 62 14 68 12 70 15 C 72 12 78 14 80 26 C 76 22 72 23 70 28 C 68 23 64 22 60 26 Z" 
          fill="#1A0601" stroke="#3D1408" stroke-width="1.5"/>

    <!-- Enormous Muscular Head (Đầu to gấp đôi thân mình để chứa cơ hàm) -->
    <path d="M 70,24 C 54,24 48,34 50,48 C 52,60 62,64 70,64 C 78,64 88,60 90,48 C 92,34 86,24 70,24 Z" 
          fill="url(#majorHeadGrad)"/>
    <!-- Deep Sagittal Groove on Head (Rãnh giữa đầu đặc trưng của Camponotus/Messor Major) -->
    <path d="M 70 25 Q 70 38 70 48" stroke="#1D0803" stroke-width="1.8" fill="none"/>

    <!-- Compound Eyes -->
    <ellipse cx="54" cy="42" rx="2.5" ry="3.8" fill="#060201" transform="rotate(-15 54 42)"/>
    <ellipse cx="86" cy="42" rx="2.5" ry="3.8" fill="#060201" transform="rotate(15 86 42)"/>
    <circle cx="53.5" cy="40.5" r="0.9" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="85.5" cy="40.5" r="0.9" fill="#FFFFFF" opacity="0.6"/>

    <!-- Thorax -->
    <ellipse cx="70" cy="74" rx="10" ry="9" fill="url(#majorBodyGrad)"/>
    
    <!-- Petiole (Cuống eo) -->
    <ellipse cx="70" cy="86" rx="4.5" ry="3.8" fill="#2E0E05"/>

    <!-- Gaster (Bụng kiến thợ lớn) -->
    <ellipse cx="70" cy="106" rx="15" ry="19" fill="url(#majorBodyGrad)"/>
    <path d="M 58 98 Q 70 102 82 98" fill="none" stroke="#D17842" stroke-width="1.4" opacity="0.6"/>
    <path d="M 56 106 Q 70 111 84 106" fill="none" stroke="#C46834" stroke-width="1.4" opacity="0.5"/>
    <path d="M 60 115 Q 70 120 80 115" fill="none" stroke="#B05526" stroke-width="1.4" opacity="0.4"/>
  </g>
</svg>
