<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <radialGradient id="cricketGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#728F42"/>
      <stop offset="50%" stop-color="#4A6624"/>
      <stop offset="100%" stop-color="#24380E"/>
    </radialGradient>
    <radialGradient id="proteinCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF1E0"/>
      <stop offset="70%" stop-color="#D8C4A0"/>
      <stop offset="100%" stop-color="#9E8762"/>
    </radialGradient>
  </defs>

  <!-- Fallen Insect Prey Chunk (Mẩu côn trùng giàu đạm dế/châu chấu tự nhiên) -->
  <g>
    <!-- Hind Leg Segment -->
    <path d="M 30,65 Q 45,45 60,35 Q 75,30 85,20" fill="none" stroke="#3D541C" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60,35 L 75,60" fill="none" stroke="#2B3D12" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Thorax Chitin Shell -->
    <ellipse cx="42" cy="42" rx="20" ry="15" fill="url(#cricketGrad)"/>
    
    <!-- Exposed Nutritious Protein Tissue (Mô thịt đạm trắng ngà béo ngậy nuôi ấu trùng) -->
    <ellipse cx="36" cy="40" rx="10" ry="7" fill="url(#proteinCore)"/>
    
    <!-- Segment lines on exoskeleton -->
    <path d="M 30,32 Q 42,36 54,32" fill="none" stroke="#1D2E0B" stroke-width="2"/>
    <path d="M 32,44 Q 44,48 56,44" fill="none" stroke="#1D2E0B" stroke-width="2"/>
  </g>
</svg>
