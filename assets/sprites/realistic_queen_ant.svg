<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="queenGasterGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#9C5232"/>
      <stop offset="35%" stop-color="#5A291A"/>
      <stop offset="75%" stop-color="#281109"/>
      <stop offset="100%" stop-color="#0E0503"/>
    </radialGradient>
    <radialGradient id="queenThoraxGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#844126"/>
      <stop offset="55%" stop-color="#421C11"/>
      <stop offset="100%" stop-color="#140603"/>
    </radialGradient>
    <radialGradient id="queenHeadGrad" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#803D22"/>
      <stop offset="65%" stop-color="#3B180E"/>
      <stop offset="100%" stop-color="#100502"/>
    </radialGradient>
    <filter id="queenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#queenGlow)">
    <!-- 6 Articulated Legs -->
    <path d="M 72 62 Q 52 46 38 32 Q 30 22 18 28" fill="none" stroke="#2B1209" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 88 62 Q 108 46 122 32 Q 130 22 142 28" fill="none" stroke="#2B1209" stroke-width="3.2" stroke-linecap="round"/>
    
    <path d="M 68 72 Q 46 70 30 74 Q 18 78 10 90" fill="none" stroke="#240D06" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 92 72 Q 114 70 130 74 Q 142 78 150 90" fill="none" stroke="#240D06" stroke-width="3.4" stroke-linecap="round"/>
    
    <path d="M 70 82 Q 48 94 36 114 Q 28 128 16 140" fill="none" stroke="#1D0A04" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 90 82 Q 112 94 124 114 Q 132 128 144 140" fill="none" stroke="#1D0A04" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Antennae -->
    <path d="M 72 38 Q 62 22 54 12 Q 48 8 42 6" fill="none" stroke="#3A170C" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 88 38 Q 98 22 106 12 Q 112 8 118 6" fill="none" stroke="#3A170C" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Mandibles -->
    <path d="M 74 26 Q 79 20 80 21 Q 81 20 86 26 Z" fill="#240C05"/>

    <!-- Head -->
    <ellipse cx="80" cy="40" rx="13" ry="14" fill="url(#queenHeadGrad)"/>
    <!-- Compound Eyes with multi-facet sheen -->
    <ellipse cx="70" cy="38" rx="3.2" ry="4.5" fill="#080201" transform="rotate(-15 70 38)"/>
    <ellipse cx="90" cy="38" rx="3.2" ry="4.5" fill="#080201" transform="rotate(15 90 38)"/>
    <circle cx="69" cy="36.5" r="1.1" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="89" cy="36.5" r="1.1" fill="#FFFFFF" opacity="0.65"/>

    <!-- Wing Scars / Heavy Mesothorax (Đặc trưng Nữ Hoàng đã bẻ cánh) -->
    <ellipse cx="80" cy="62" rx="14" ry="13" fill="url(#queenThoraxGrad)"/>
    <ellipse cx="80" cy="76" rx="12" ry="8" fill="url(#queenThoraxGrad)"/>
    <path d="M 68 56 Q 80 52 92 56" fill="none" stroke="#B8653A" stroke-width="1.5" opacity="0.4"/>

    <!-- Petiole (Cuống eo chịu lực) -->
    <ellipse cx="80" cy="85" rx="5.5" ry="4.5" fill="#3D170C"/>

    <!-- Giant Swollen Gaster / Physogastric Abdomen (Bụng chứa trứng khổng lồ) -->
    <ellipse cx="80" cy="114" rx="22" ry="28" fill="url(#queenGasterGrad)"/>
    
    <!-- Stretched Intersegmental Membranes (Màng liên kết căng phồng màu hổ phách) -->
    <path d="M 63 100 Q 80 106 97 100" fill="none" stroke="#DDA16A" stroke-width="2.2" opacity="0.8"/>
    <path d="M 59 110 Q 80 117 101 110" fill="none" stroke="#D58E50" stroke-width="2.2" opacity="0.75"/>
    <path d="M 61 120 Q 80 128 99 120" fill="none" stroke="#C47838" stroke-width="2" opacity="0.65"/>
    <path d="M 66 130 Q 80 137 94 130" fill="none" stroke="#B06226" stroke-width="1.8" opacity="0.55"/>

    <!-- Glossy Highlights -->
    <path d="M 72 98 Q 78 94 88 97 Q 90 104 80 104 Q 74 102 72 98 Z" fill="#FFFFFF" opacity="0.32"/>
    <ellipse cx="74" cy="112" rx="4" ry="7" fill="#FFFFFF" opacity="0.22" transform="rotate(-18 74 112)"/>
  </g>
</svg>
